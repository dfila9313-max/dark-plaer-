# Local development environment: `make dev` from the repository root.
name: admino

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admino
      POSTGRES_PASSWORD: admino
      POSTGRES_DB: admino
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admino"]
      interval: 3s
      retries: 20

  minio:
    # S3-compatible storage for logos and photos (production: provider's object storage)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admino
      MINIO_ROOT_PASSWORD: admino-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    # Catches all outgoing email in development: http://localhost:8025
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  api:
    build: ../apps/api
    env_file: ../.env
    environment:
      ADMINO_DATABASE_URL: postgresql+asyncpg://admino:admino@postgres:5432/admino
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ../apps/web
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
